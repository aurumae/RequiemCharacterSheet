name: Character save contract
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: saves-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: android/gradlew -p android :rules:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Check release packaging without private signing credentials
        run: android/gradlew -p android :app:lintRelease :app:bundleRelease -PrequiemUnsignedRelease=true
      - uses: actions/upload-artifact@v4
        with:
          name: requiem-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
  exchange:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: scripts/check-save-contract

  ios:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Choose an available iPhone simulator
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "--json"]))["devices"]
          phone = next(d for runtime, group in devices.items() if ".iOS-" in runtime for d in group if d["name"].startswith("iPhone") and d["isAvailable"])
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write("REQUIEM_SIMULATOR=" + phone["udid"] + "\n")
          PYTHON
      # UI tests run in Xcode Cloud and locally; on GitHub's slower shared runners their first look at the
      # character sheet can time out, so only the unit tests run here.
      - name: Build and test the Xcode app
        run: >-
          xcodebuild test -project RequiemCharacterSheet.xcodeproj
          -scheme RequiemCharacterSheet
          -destination "platform=iOS Simulator,id=$REQUIEM_SIMULATOR"
          -skip-testing:RequiemCharacterSheetUITests
          -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO
          -resultBundlePath ios-test-results.xcresult
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: requiem-ios-test-results
          path: ios-test-results.xcresult
